BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "rowanos_framework"
BBFILE_PATTERN_rowanos_framework = "^${LAYERDIR}/"
BBFILE_PRIORITY_rowanos_framework = "20"

LAYERDEPENDS_rowanos_framework = "core"
LAYERSERIES_COMPAT_rowanos_framework = "scarthgap"
